# version-aliases.yaml — bundled default alias manifest for the
# IKE Version Management Extension (IKE-Network/ike-issues#472, #525).
#
# This file is read from the extension's classpath when the
# extension is registered in .mvn/extensions.xml. It declares the
# canonical typed-marker pins and the legacy short-name aliases
# that the extension injects into consumers' POMs at file-model
# stage.
#
# Sections:
#
#   canonical: <G>__GA__<A>__VERSION → version
#       Default version pins in the IKE typed-marker family form
#       (#525). Injected only when the consumer's POM doesn't
#       already declare the property — never overrides an explicit
#       declaration.
#
#   aliases: legacy-short-name → <G>__GA__<A>__VERSION
#       Legacy short-name property idioms (from the wider Maven
#       ecosystem and IKE's pre-convention history). The extension
#       injects whichever side of the alias is missing, pointing
#       at the side that IS declared, so both names resolve to
#       the same value.
#
# Schema version 1.
schema: 1

canonical:
  # ── IKE foundation (Tier 0 / Tier 1) ───────────────────────────
  # Versions here are conservative defaults; the canonical pin
  # lives in ike-base-parent v14+ and overrides these via parent
  # inheritance. Listed here so projects that don't inherit
  # ike-base-parent still get sensible defaults.
  network.ike__GA__ike-base-parent__VERSION: 13
  network.ike__GA__ike-java-support__VERSION: 6
  network.ike.tooling__GA__ike-tooling__VERSION: 214
  network.ike.tooling__GA__ike-workspace-extension__VERSION: 7
  network.ike.tooling__GA__ike-version-management-extension__VERSION: 6
  network.ike.docs__GA__ike-docs__VERSION: 63
  network.ike.platform__GA__ike-platform__VERSION: 91

  # ── Test stack ─────────────────────────────────────────────────
  org.junit.jupiter__GA__junit-jupiter__VERSION: 6.0.0
  org.junit.jupiter__GA__junit-jupiter-api__VERSION: 6.0.0
  org.junit.jupiter__GA__junit-jupiter-engine__VERSION: 6.0.0
  org.junit.jupiter__GA__junit-jupiter-params__VERSION: 6.0.0
  org.junit__GA__junit-bom__VERSION: 6.0.0
  org.assertj__GA__assertj-core__VERSION: 3.27.3
  org.mockito__GA__mockito-core__VERSION: 5.14.2
  org.mockito__GA__mockito-junit-jupiter__VERSION: 5.14.2

  # ── Collections / utilities ────────────────────────────────────
  org.eclipse.collections__GA__eclipse-collections-api__VERSION: 12.0.0
  org.eclipse.collections__GA__eclipse-collections__VERSION: 12.0.0
  org.eclipse.collections__GA__eclipse-collections-forkjoin__VERSION: 12.0.0

  # ── Logging ────────────────────────────────────────────────────
  org.slf4j__GA__slf4j-api__VERSION: 2.0.16
  ch.qos.logback__GA__logback-classic__VERSION: 1.5.18

  # ── Maven plugins (versions IKE consumers commonly pin) ────────
  org.apache.maven.plugins__GA__maven-compiler-plugin__VERSION: 3.14.0
  org.apache.maven.plugins__GA__maven-surefire-plugin__VERSION: 3.5.3
  org.apache.maven.plugins__GA__maven-failsafe-plugin__VERSION: 3.5.3
  org.apache.maven.plugins__GA__maven-assembly-plugin__VERSION: 3.7.1
  org.apache.maven.plugins__GA__maven-dependency-plugin__VERSION: 3.9.0
  org.apache.maven.plugins__GA__maven-resources-plugin__VERSION: 3.3.1
  org.apache.maven.plugins__GA__maven-source-plugin__VERSION: 3.3.1
  org.apache.maven.plugins__GA__maven-javadoc-plugin__VERSION: 3.11.2
  org.apache.maven.plugins__GA__maven-gpg-plugin__VERSION: 3.2.8
  org.apache.maven.plugins__GA__maven-site-plugin__VERSION: 3.21.0
  org.apache.maven.plugins__GA__maven-jar-plugin__VERSION: 3.4.2
  org.apache.maven.plugins__GA__maven-clean-plugin__VERSION: 3.4.0
  org.apache.maven.plugins__GA__maven-install-plugin__VERSION: 3.1.3
  org.apache.maven.plugins__GA__maven-deploy-plugin__VERSION: 3.1.3
  org.jreleaser__GA__jreleaser-maven-plugin__VERSION: 1.24.0

aliases:
  # ── IKE foundation legacy short names ──────────────────────────
  ike-base-parent.version: network.ike__GA__ike-base-parent__VERSION
  ike-tooling.version: network.ike.tooling__GA__ike-tooling__VERSION
  ike-workspace-extension.version: network.ike.tooling__GA__ike-workspace-extension__VERSION
  ike-version-management-extension.version: network.ike.tooling__GA__ike-version-management-extension__VERSION
  ike-docs.version: network.ike.docs__GA__ike-docs__VERSION
  ike-platform.version: network.ike.platform__GA__ike-platform__VERSION

  # ── Test stack ─────────────────────────────────────────────────
  junit-jupiter.version: org.junit.jupiter__GA__junit-jupiter__VERSION
  junit.version: org.junit.jupiter__GA__junit-jupiter__VERSION
  assertj.version: org.assertj__GA__assertj-core__VERSION
  mockito.version: org.mockito__GA__mockito-core__VERSION

  # ── Collections / utilities ────────────────────────────────────
  eclipse-collections.version: org.eclipse.collections__GA__eclipse-collections__VERSION
  eclipse-collections-api.version: org.eclipse.collections__GA__eclipse-collections-api__VERSION

  # ── Logging ────────────────────────────────────────────────────
  slf4j.version: org.slf4j__GA__slf4j-api__VERSION
  logback.version: ch.qos.logback__GA__logback-classic__VERSION

  # ── Maven plugins ──────────────────────────────────────────────
  maven-compiler-plugin.version: org.apache.maven.plugins__GA__maven-compiler-plugin__VERSION
  maven-surefire-plugin.version: org.apache.maven.plugins__GA__maven-surefire-plugin__VERSION
  maven-failsafe-plugin.version: org.apache.maven.plugins__GA__maven-failsafe-plugin__VERSION
  maven-assembly-plugin.version: org.apache.maven.plugins__GA__maven-assembly-plugin__VERSION
  maven-dependency-plugin.version: org.apache.maven.plugins__GA__maven-dependency-plugin__VERSION
  maven-resources-plugin.version: org.apache.maven.plugins__GA__maven-resources-plugin__VERSION
  maven-source-plugin.version: org.apache.maven.plugins__GA__maven-source-plugin__VERSION
  maven-javadoc-plugin.version: org.apache.maven.plugins__GA__maven-javadoc-plugin__VERSION
  maven-gpg-plugin.version: org.apache.maven.plugins__GA__maven-gpg-plugin__VERSION
  maven-site-plugin.version: org.apache.maven.plugins__GA__maven-site-plugin__VERSION
  jreleaser-maven-plugin.version: org.jreleaser__GA__jreleaser-maven-plugin__VERSION
