# version-aliases.yaml — bundled default alias manifest for the
# IKE Version Management Extension (IKE-Network/ike-issues#472).
#
# This file is read from the extension's classpath when the
# extension is registered in .mvn/extensions.xml. It declares the
# canonical ${G·A} pins and the legacy short-name aliases that the
# extension injects into consumers' POMs at file-model stage.
#
# Sections:
#
#   canonical: G·A → version
#       Default version pins for the IKE GA·convention. Injected
#       only when the consumer's POM doesn't already declare the
#       property — never overrides an explicit declaration.
#
#   aliases: legacy-short-name → G·A
#       Legacy short-name property idioms (from the wider Maven
#       ecosystem and IKE's pre-convention history). The extension
#       injects whichever side of the alias is missing, pointing
#       at the side that IS declared, so both names resolve to
#       the same value.
#
# Schema version 1.
schema: 1

canonical:
  # ── IKE foundation (Tier 0 / Tier 1) ───────────────────────────
  # Versions here are conservative defaults; the canonical pin
  # lives in ike-base-parent v7+ and overrides these via parent
  # inheritance. Listed here so projects that don't inherit
  # ike-base-parent still get sensible defaults.
  network.ike·ike-base-parent: 6
  network.ike.tooling·ike-tooling: 194
  network.ike.tooling·ike-workspace-extension: 4
  network.ike.tooling·ike-version-management-extension: 1
  network.ike.docs·ike-docs: 50
  network.ike.platform·ike-platform: 80

  # ── Test stack ─────────────────────────────────────────────────
  org.junit.jupiter·junit-jupiter: 6.0.0
  org.junit.jupiter·junit-jupiter-api: 6.0.0
  org.junit.jupiter·junit-jupiter-engine: 6.0.0
  org.junit.jupiter·junit-jupiter-params: 6.0.0
  org.junit·junit-bom: 6.0.0
  org.assertj·assertj-core: 3.27.3
  org.mockito·mockito-core: 5.14.2
  org.mockito·mockito-junit-jupiter: 5.14.2

  # ── Collections / utilities ────────────────────────────────────
  org.eclipse.collections·eclipse-collections-api: 12.0.0
  org.eclipse.collections·eclipse-collections: 12.0.0
  org.eclipse.collections·eclipse-collections-forkjoin: 12.0.0

  # ── Logging ────────────────────────────────────────────────────
  org.slf4j·slf4j-api: 2.0.16
  ch.qos.logback·logback-classic: 1.5.18

  # ── Maven plugins (versions IKE consumers commonly pin) ────────
  org.apache.maven.plugins·maven-compiler-plugin: 3.14.0
  org.apache.maven.plugins·maven-surefire-plugin: 3.5.3
  org.apache.maven.plugins·maven-failsafe-plugin: 3.5.3
  org.apache.maven.plugins·maven-assembly-plugin: 3.7.1
  org.apache.maven.plugins·maven-dependency-plugin: 3.9.0
  org.apache.maven.plugins·maven-resources-plugin: 3.3.1
  org.apache.maven.plugins·maven-source-plugin: 3.3.1
  org.apache.maven.plugins·maven-javadoc-plugin: 3.11.2
  org.apache.maven.plugins·maven-gpg-plugin: 3.2.8
  org.apache.maven.plugins·maven-site-plugin: 3.21.0
  org.apache.maven.plugins·maven-jar-plugin: 3.4.2
  org.apache.maven.plugins·maven-clean-plugin: 3.4.0
  org.apache.maven.plugins·maven-install-plugin: 3.1.3
  org.apache.maven.plugins·maven-deploy-plugin: 3.1.3
  org.jreleaser·jreleaser-maven-plugin: 1.24.0

aliases:
  # ── IKE foundation legacy short names ──────────────────────────
  ike-base-parent.version: network.ike·ike-base-parent
  ike-tooling.version: network.ike.tooling·ike-tooling
  ike-workspace-extension.version: network.ike.tooling·ike-workspace-extension
  ike-version-management-extension.version: network.ike.tooling·ike-version-management-extension
  ike-docs.version: network.ike.docs·ike-docs
  ike-platform.version: network.ike.platform·ike-platform

  # ── Test stack ─────────────────────────────────────────────────
  junit-jupiter.version: org.junit.jupiter·junit-jupiter
  junit.version: org.junit.jupiter·junit-jupiter
  assertj.version: org.assertj·assertj-core
  mockito.version: org.mockito·mockito-core

  # ── Collections / utilities ────────────────────────────────────
  eclipse-collections.version: org.eclipse.collections·eclipse-collections
  eclipse-collections-api.version: org.eclipse.collections·eclipse-collections-api

  # ── Logging ────────────────────────────────────────────────────
  slf4j.version: org.slf4j·slf4j-api
  logback.version: ch.qos.logback·logback-classic

  # ── Maven plugins ──────────────────────────────────────────────
  maven-compiler-plugin.version: org.apache.maven.plugins·maven-compiler-plugin
  maven-surefire-plugin.version: org.apache.maven.plugins·maven-surefire-plugin
  maven-failsafe-plugin.version: org.apache.maven.plugins·maven-failsafe-plugin
  maven-assembly-plugin.version: org.apache.maven.plugins·maven-assembly-plugin
  maven-dependency-plugin.version: org.apache.maven.plugins·maven-dependency-plugin
  maven-resources-plugin.version: org.apache.maven.plugins·maven-resources-plugin
  maven-source-plugin.version: org.apache.maven.plugins·maven-source-plugin
  maven-javadoc-plugin.version: org.apache.maven.plugins·maven-javadoc-plugin
  maven-gpg-plugin.version: org.apache.maven.plugins·maven-gpg-plugin
  maven-site-plugin.version: org.apache.maven.plugins·maven-site-plugin
  jreleaser-maven-plugin.version: org.jreleaser·jreleaser-maven-plugin
