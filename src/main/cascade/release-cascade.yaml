# release-cascade.yaml — ike-version-management-extension's edges
# in the IKE release cascade (IKE-Network/ike-issues#420, #460,
# #470).
#
# Standalone Tier 0 artifact, like ike-workspace-extension: no
# cascade-tracked upstream. Inherits ike-base-parent via <parent>,
# but parent-inheritance bumps are not yet cascade-tracked
# (IKE-Network/ike-issues#462). Asserting head positively so a
# forgotten upstream edge would be a manifest error, not a silent
# omission.

schema: 1

# Post-#526: base-parent v15+ no longer carries the IKE-foundation
# pins, so vm-ext declares its own ike-java-support pin and lets
# the cascade walker advance it on every java-support release.
upstream:
  - groupId: network.ike
    artifactId: ike-java-support
    url: https://github.com/IKE-Network/ike-java-support.git

# No downstream consumers in the foundation cascade. The extension
# is opt-in via .mvn/extensions.xml; foundation projects that
# register it (workspace-reactor-example, ike-platform's plugin workspace)
# do so as a tooling choice, not as a cascade dependency. When
# the cascade walker grows extension-registration awareness, this
# section will list those consumers. Asserted positively as a
# terminal so a forgotten downstream edge would be a manifest
# error, not a silent omission.
terminal: true
